name: Cleanup Actions Artifacts 2026-09-09
on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-actions-artifacts-2026-09-09.yml']
permissions:
  actions: write
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete repository Actions artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp)
          gh api --paginate "repos/${GH_REPO}/actions/artifacts?per_page=100" --jq '.artifacts[] | [.id,.size_in_bytes] | @tsv' > "$tmp"
          count=$(wc -l < "$tmp" | tr -d ' '); deleted=0; reclaimed=0
          while IFS=$'\t' read -r id size; do [ -n "${id:-}" ] || continue; gh api --method DELETE "repos/${GH_REPO}/actions/artifacts/${id}"; deleted=$((deleted+1)); reclaimed=$((reclaimed+size)); done < "$tmp"
          remaining=$(gh api --paginate "repos/${GH_REPO}/actions/artifacts?per_page=100" --jq '[.artifacts[]] | length' | awk '{s+=$1} END {print s+0}')
          printf '{"artifactsBefore":%s,"artifactsDeleted":%s,"bytesReclaimed":%s,"artifactsAfter":%s}\n' "$count" "$deleted" "$reclaimed" "$remaining" > artifact-cleanup-report.json
      - name: Commit report
        run: |
          git config user.name 'Lumi Maintenance Bot'; git config user.email 'lumi-maintenance@users.noreply.github.com'
          git add artifact-cleanup-report.json; git commit -m 'Record Actions artifact cleanup' || exit 0; git push origin HEAD:main
